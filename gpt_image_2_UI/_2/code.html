<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>管理后台</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Manrope:wght@600;700&amp;family=Space+Grotesk:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#fefcff",
                        "on-primary-container": "#7c839b",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "tertiary-fixed": "#d3e4fe",
                        "primary-fixed": "#dae2fd",
                        "tertiary-container": "#0b1c30",
                        "primary-container": "#131b2e",
                        "secondary": "#0058be",
                        "on-tertiary-container": "#75859d",
                        "on-primary-fixed": "#131b2e",
                        "on-tertiary-fixed-variant": "#38485d",
                        "outline-variant": "#c6c6cd",
                        "surface-bright": "#f7f9fb",
                        "inverse-surface": "#2d3133",
                        "secondary-container": "#2170e4",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-surface": "#191c1e",
                        "surface-container": "#eceef0",
                        "surface-container-highest": "#e0e3e5",
                        "surface-tint": "#565e74",
                        "outline": "#76777d",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "on-secondary-fixed-variant": "#004395",
                        "surface-dim": "#d8dadc",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed-dim": "#bec6e0",
                        "secondary-fixed": "#d8e2ff",
                        "on-primary": "#ffffff",
                        "background": "#f7f9fb",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e6e8ea",
                        "on-error": "#ffffff",
                        "tertiary": "#000000",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#3f465c",
                        "secondary-fixed-dim": "#adc6ff",
                        "on-secondary-fixed": "#001a42",
                        "surface-variant": "#e0e3e5",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#bec6e0",
                        "on-surface-variant": "#45464d",
                        "on-tertiary-fixed": "#0b1c30",
                        "surface": "#f7f9fb",
                        "on-background": "#191c1e",
                        "primary": "#000000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "margin": "48px",
                        "unit": "4px",
                        "stack-lg": "32px",
                        "gutter": "24px",
                        "container-max": "1440px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "code-snippet": ["Space Grotesk"],
                        "headline-md": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "label-caps": ["Space Grotesk"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "code-snippet": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-lg": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-md": ["15px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom input transition logic to match design system requirement */
        .admin-input {
            border-bottom-width: 1px;
            border-bottom-color: var(--tw-colors-outline-variant);
            transition: all 0.2s ease-in-out;
        }
        .admin-input:focus {
            border-width: 1px;
            border-color: var(--tw-colors-secondary);
            border-radius: var(--tw-border-radius-DEFAULT);
            padding-left: 12px;
            padding-right: 12px;
            background-color: var(--tw-colors-surface-container-lowest);
            outline: none;
            box-shadow: none;
        }
    </style>
</head>
<body class="bg-background min-h-screen font-body-md text-on-background selection:bg-secondary-fixed selection:text-on-secondary-fixed antialiased">
<!-- Minimalist Background Layer -->
<div class="fixed inset-0 pointer-events-none overflow-hidden flex items-center justify-center opacity-30">
<div class="w-[80vw] h-[80vw] md:w-[40vw] md:h-[40vw] rounded-full bg-surface-container-highest blur-[100px] absolute translate-x-1/4 -translate-y-1/4"></div>
<div class="w-[60vw] h-[60vw] md:w-[30vw] md:h-[30vw] rounded-full bg-surface-variant blur-[80px] absolute -translate-x-1/3 translate-y-1/3"></div>
</div>
<!-- Main Content Canvas (Navigation suppressed due to Transactional intent) -->
<div class="min-h-screen flex items-center justify-center p-gutter relative z-10">
<!-- Login Card -->
<main class="w-full max-w-[380px] bg-surface-container-lowest border border-outline-variant rounded-xl p-margin shadow-sm">
<form class="flex flex-col gap-stack-lg" onsubmit="event.preventDefault();">
<!-- Username Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest pl-1" for="username">用户名</label>
<input autocomplete="off" class="admin-input w-full bg-transparent border-0 px-1 py-3 font-code-snippet text-code-snippet text-on-surface placeholder:text-transparent focus:placeholder:text-outline" id="username" placeholder="请输入用户名" required="" type="text"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest pl-1" for="password">密码</label>
<input class="admin-input w-full bg-transparent border-0 px-1 py-3 font-code-snippet text-code-snippet text-on-surface placeholder:text-transparent focus:placeholder:text-outline" id="password" placeholder="请输入密码" required="" type="password"/>
</div>
<!-- Submit Action -->
<div class="pt-stack-md mt-stack-sm">
<button class="w-full bg-primary text-on-primary font-body-md text-body-md py-4 rounded-DEFAULT hover:bg-inverse-surface transition-colors duration-300 flex items-center justify-center gap-2 group" type="submit">
<span>进入管理后台</span>
<span aria-hidden="true" class="material-symbols-outlined text-[18px] opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300">arrow_forward</span>
</button>
</div>
</form>
</main>
</div>
</body></html>
